name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Modules
        working-directory: tests
        run: npm install --no-audit --no-fund && node check-modules.mjs
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Navigateur
        run: |
          pip install pytest playwright
          python -m playwright install --with-deps chromium
          python -m pytest -q tests/e2e
  relais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Relais TMDB
        run: deno test --allow-env tests/function/
        env: { SINEMA_NO_SERVE: "1", TMDB_TOKEN: test, SUPABASE_URL: "https://x.supabase.co" }
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pg }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Schéma
        run: ./tests/sql/run.sh
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: pg }
